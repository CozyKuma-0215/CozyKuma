<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CozyKuma</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:title" content="CozyKuma: 감성 음악 힐링 공간" />
  <meta property="og:description" content="자연 속에서 듣는 힐링 사운드, 숲속의 고요함과 함께하는 피아노 선율" />
  <meta property="og:image" content="https://cozykuma-0215.github.io/CozyKuma/icon-512.png" />
  <meta property="og:url" content="https://cozykuma-0215.github.io/CozyKuma/" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f4f8;
      text-align: center;
      color: #333;
    }
    h1 {
      margin-top: 40px;
      font-size: 1.6rem;
    }
    p {
      color: #555;
      padding: 0 16px;
      font-size: 1rem;
    }
    .button {
      margin: 16px auto;
      display: block;
      width: 90%;
      max-width: 340px;
      padding: 14px;
      background-color: #3b82f6;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #2563eb;
    }
    .content-box {
      margin: 20px auto;
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      width: 90%;
      max-width: 720px;
      text-align: left;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>🎵 CozyKuma: 감성 음악 힐링 공간 🎵</h1>
  <p>이 페이지를 홈 화면에 추가하면 앱처럼 실행됩니다 📱</p>

  <button class="button" onclick="showPrompt('longform')">📺 가로 영상 프롬프트</button>
  <button class="button" onclick="showPrompt('shorts')">🎞️ 숏폼 영상 프롬프트</button>
  <button class="button" onclick="showPrompt('music')">🎵 음악 프롬프트</button>
  <button class="button" onclick="showPrompt('fonttag')">🖋️ 폰트 + 해시태그 추천</button>

  <div id="output" class="content-box">여기에서 선택한 프롬프트 내용을 확인할 수 있습니다.</div>

  <script>
    function showPrompt(type) {
      let message = "";
      switch (type) {
        case "longform":
          message = `📺 유튜브 가로영상 프롬프트\n\n주제: 고요한 봄 숲의 새벽\n장르: 힐링 피아노\n영상 프롬프트: sunrise forest, gentle birdsong, misty light in wide shot`;
          break;
        case "shorts":
          message = `🎞️ 숏폼 프롬프트\n\n주제: 작은 새가 비를 피하는 순간\n장르: 자연음 + 로파이\n영상 프롬프트: vertical format, slow motion raindrop with bird`;
          break;
        case "music":
          message = `🎵 음악 프롬프트\n\nmelancholy ambient sound with forest rain and distant thunder, emotional texture with warm piano`;
          break;
        case "fonttag":
          message = `🖋️ 추천 폰트: 나눔손글씨 펜체\n🔤 해시태그: #힐링 #자연음악 #감성프롬프트 #CozyKuma #편안한순간`;
          break;
        default:
          message = "⚠️ 알 수 없는 항목입니다.";
      }
      document.getElementById("output").textContent = message;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('✅ Service Worker 등록됨:', reg.scope))
        .catch(err => console.error('❌ 등록 실패:', err));
    }
  </script>
</body>
</html>
