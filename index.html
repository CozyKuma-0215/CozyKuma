<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CozyKuma: 감성 음악 힐링 공간</title>
  <meta name="theme-color" content="#f2f2f2" />
  <meta property="og:title" content="CozyKuma 힐링 음악 공간" />
  <meta property="og:description" content="AI가 매일 추천하는 감성 음악과 썸네일을 만나보세요 🎵" />
  <meta property="og:image" content="icon-512.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      background: #fefefe;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3vh 4vw;
      text-align: center;
    }
    h1 {
      font-size: 1.8em;
      margin-top: 40px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 24px;
    }
    button {
      background: #7aa9ff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1em;
      color: white;
      margin: 12px 0;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: background 0.2s;
    }
    button:hover {
      background: #5d8fff;
    }
    .section {
      margin-top: 30px;
      width: 100%;
      max-width: 500px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🎵 CozyKuma: 감성 음악 힐링 공간 🎵</h1>
  <p>이 페이지를 홈 화면에 추가하면 앱처럼 실행됩니다 📱</p>

  <div class="section">
    <button onclick="alert('AI 프롬프트가 생성되었습니다!')">📌 오늘의 프롬프트 보기</button>
    <button onclick="alert('유튜브 가로영상용 데이터 시트 열람')">🖥️ 유튜브 가로영상용 보기</button>
    <button onclick="alert('인스타/틱톡 숏츠용 보기')">📱 숏츠용 보기</button>
    <button onclick="alert('프롬프트 저장소 열람')">📚 프롬프트 라이브러리</button>
    <button onclick="alert('음악 프롬프트 추천 보기')">🎵 음악 프롬프트 보기</button>
    <button onclick="alert('폰트 & 해시태그 추천 보기')">🖋️ 폰트 + 해시태그 추천</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then(() => {
          console.log('✅ Service Worker Registered');
        });
      });
    }
  </script>
</body>
</html>
