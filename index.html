<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CozyKuma</title>
  <meta name="description" content="CozyKuma는 감성 음악과 자연 힐링을 위한 AI 자동화 콘텐츠 플랫폼입니다. 유튜브, 숏폼, 음악 프롬프트를 확인해보세요." />
  <meta name="keywords" content="CozyKuma, 힐링 음악, 숲속, 피아노, 감성 프롬프트, 자동화, 자연, 명상, 수면 음악, 숏폼, 유튜브 영상" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:title" content="CozyKuma: 감성 음악 힐링 공간" />
  <meta property="og:description" content="자연 속에서 듣는 힐링 사운드, 숲속의 고요함과 함께하는 피아노 선율" />
  <meta property="og:image" content="https://cozykuma-0215.github.io/CozyKuma/icon-512.png" />
  <meta property="og:url" content="https://cozykuma-0215.github.io/CozyKuma/" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f4f8;
      text-align: center;
      color: #333;
    }
    h1 {
      margin-top: 40px;
      font-size: 1.6rem;
    }
    p {
      color: #555;
      padding: 0 16px;
      font-size: 1rem;
    }
    .button {
      margin: 16px auto;
      display: block;
      width: 90%;
      max-width: 340px;
      padding: 14px;
      background-color: #3b82f6;
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #2563eb;
    }
    .content-box {
      margin: 20px auto;
      padding: 16px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      width: 90%;
      max-width: 720px;
      text-align: left;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>🎵 CozyKuma: 감성 음악 힐링 공간 🎵</h1>
  <p>이 페이지를 홈 화면에 추가하면 앱처럼 실행됩니다 📱</p>

  <button class="button" onclick="loadSheet('시트1')">📺 유튜브 가로영상 시트 보기</button>
  <button class="button" onclick="loadSheet('시트2')">🎞️ 숏폼 영상 시트 보기</button>
  <button class="button" onclick="loadSheet('시트3')">📚 프롬프트 저장소 보기</button>
  <button class="button" onclick="loadSheet('시트4')">🎵 음악 프롬프트 보기</button>

  <div id="output" class="content-box">스프레드시트에서 데이터를 불러오는 중입니다...</div>

  <script>
    async function loadSheet(sheetName) {
      const sheetId = "YOUR_PUBLIC_SHEET_ID"; // 👉 구글 시트 공개 공유 후 ID 삽입
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        let table = "<table><tbody>";
        const cols = json.table.cols.map(col => col.label);
        table += `<tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
        json.table.rows.forEach(row => {
          table += `<tr>${row.c.map(cell => `<td>${cell?.v || ""}</td>`).join('')}</tr>`;
        });
        table += "</tbody></table>";
        document.getElementById("output").innerHTML = table;
      } catch (err) {
        document.getElementById("output").innerText = "❌ 데이터를 불러오지 못했습니다.";
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('✅ Service Worker 등록됨:', reg.scope))
        .catch(err => console.error('❌ 등록 실패:', err));
    }
  </script>
</body>
</html>
